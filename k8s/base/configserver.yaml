apiVersion: v1
kind: Service
metadata:
  name: configserver
  labels:
    app: configserver
spec:
  selector:
    app: configserver
  ports:
    - name: http
      port: 8071
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  labels:
    app: configserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: eazybytes/configserver:s14
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8071
          env:
            - name: OTEL_SERVICE_NAME
              value: configserver
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 700Mi
