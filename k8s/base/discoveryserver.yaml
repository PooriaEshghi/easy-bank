# Legge i Service del namespace e li espone su /apps.
# Solo questo pod parla con l'API di Kubernetes.
# Docker Hub non pubblica un tag 5.0 stabile: 5.0.3-SNAPSHOT è l'immagine della linea 5.0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discoveryserver
  labels:
    app: discoveryserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discoveryserver
  labels:
    app: discoveryserver
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: discoveryserver
  labels:
    app: discoveryserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: discoveryserver
subjects:
  - kind: ServiceAccount
    name: discoveryserver
---
apiVersion: v1
kind: Service
metadata:
  name: discoveryserver
  labels:
    app: discoveryserver
spec:
  selector:
    app: discoveryserver
  ports:
    - name: http
      port: 8761
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discoveryserver
  labels:
    app: discoveryserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discoveryserver
  template:
    metadata:
      labels:
        app: discoveryserver
    spec:
      serviceAccountName: discoveryserver
      containers:
        - name: discoveryserver
          image: springcloud/spring-cloud-kubernetes-discoveryserver:5.0.3-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          env:
            # Il client Java 24 dell'immagine 5.0.3-SNAPSHOT non legge allocatedResources
            # di Kubernetes 1.36. Il check kubernetes farebbe fallire i probe.
            - name: MANAGEMENT_HEALTH_KUBERNETES_ENABLED
              value: "false"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_LIVENESS_INCLUDE
              value: livenessState
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: readinessState
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 700Mi
