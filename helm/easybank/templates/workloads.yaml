{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "easybank.serviceLabels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  type: {{ $svc.serviceType | default "ClusterIP" }}
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "easybank.serviceLabels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "easybank.serviceLabels" (dict "name" $name "root" $) | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | default (printf "%s/%s:%s" $.Values.image.repository $name ($.Values.image.tag | default $.Chart.AppVersion)) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            {{- if $svc.spring }}
            - name: SPRING_APPLICATION_NAME
              value: {{ $name | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $.Values.config.profile | quote }}
            - name: SPRING_CONFIG_IMPORT
              value: {{ $.Values.config.configImport | quote }}
            {{- end }}
            {{- if $svc.eureka }}
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: {{ $.Values.config.eurekaUrl | quote }}
            {{- end }}
            {{- if $svc.kubernetesDiscovery }}
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: SPRING_CLOUD_KUBERNETES_DISCOVERY_ENABLED
              value: "true"
            - name: SPRING_CLOUD_KUBERNETES_DISCOVERY_DISCOVERY_SERVER_URL
              value: {{ $.Values.config.discoveryServerUrl | quote }}
            {{- end }}
            {{- if $svc.kafka }}
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
              value: {{ $.Values.config.kafkaBrokers | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ $.Values.otel.tracesExporter | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ $.Values.otel.logsExporter | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ $.Values.otel.metricsExporter | quote }}
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: {{ $.Values.otel.metricsExportEnabled | quote }}
            {{- range $envName, $envValue := $svc.extraEnv }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ $.Values.probes.startup.path }}
              port: http
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $.Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
{{- end }}
{{- end }}
